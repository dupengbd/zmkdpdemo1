# Uncomment to enable encoder

CONFIG_BT_DEVICE_NAME="zmk1"




CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
CONFIG_ZMK_DISPLAY=y


# 启用 ZMK Studio
CONFIG_ZMK_STUDIO=y

# 禁用 UART 传输（这样就不会编译 uart_rpc_transport.c）
CONFIG_ZMK_STUDIO_TRANSPORT_UART=n

# 启用蓝牙传输（默认就是启用的，但明确指定一下）
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y

CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y 
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y 
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y 
# 电池百分比电量
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# 启用键盘RGB功能 必须
CONFIG_LED_STRIP=y
# 使用WS2812系列RGB灯带 必须                               
CONFIG_WS2812_STRIP=y

#不使用外部供电，直接通过键盘主控供电
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
#键盘启动时不自动开启RGB灯效
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# 开启RGB底光功能 
CONFIG_ZMK_RGB_UNDERGLOW=y
# 初始色调=160(青色，HSV色环范围0-360)                                     
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
 # 初始灯光效果=3(通常为波浪效果)                   
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
#大亮度限制为90%，防止过亮
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
#设置RGB动画速度初始值                     
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=3
# 启用电量检测
CONFIG_ZMK_BATTERY=y

# OLED 自动关闭（低于设定值）
CONFIG_ZMK_DISPLAY_AUTO_OFF=y
CONFIG_ZMK_DISPLAY_AUTO_OFF_BATTERY_PERCENT=40

# WS2812 自动关闭（低于设定值）
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_BATTERY_PERCENT=40
