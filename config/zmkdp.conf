# ===== 键盘休眠 =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300

# ===== 电池报告 =====
CONFIG_ZMK_BATTERY_REPORTING=y

# ===== OLED显示 =====
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_LVGL=y

# ===== 使用 zmk-nice-oled 自定义屏幕 =====
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# ===== zmk-nice-oled Widgets =====
# HID 指示器（Caps Lock / Num Lock / Scroll Lock）
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y

# 修饰键指示器（Shift / Ctrl / Alt / GUI）
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y

# （可选）修饰键显示为固定文字 "SFT" "CTL" 等
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_LETTER=y

