# ===== 键盘休眠 =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300

# ===== 电池报告 =====
CONFIG_ZMK_BATTERY_REPORTING=y

# ===== OLED显示 =====
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_LVGL=y

# ===== Widgets（全部启用） =====
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y       # 显示 USB/BLE 连接状态
CONFIG_ZMK_WIDGET_WPM_STATUS=y          # 显示打字速度
CONFIG_ZMK_WIDGET_CONNECTION_STATUS=y   # 显示蓝牙连接设备名
